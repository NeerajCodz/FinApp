name: Release

# When version.json changes on main, tag the release and publish a GitHub release for it.
# Tags: finapp-v<product>, web-v<x>, mobile-v<x>, ui-v<x>, backend-v<x> (existing tags are kept).
on:
  push:
    branches: [main]
    paths: [version.json]
  # Rebuild an existing release's notes and version.json (e.g. after editing a changelog).
  workflow_dispatch:
    inputs:
      version:
        description: Product version to republish (blank = version.json)
        required: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Check derived files
        run: node scripts/version.mjs check
      - name: Create missing tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tag in $(node scripts/version.mjs tags); do
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "keep $tag"
            else
              git tag -a "$tag" -m "$tag" && git push origin "$tag"
            fi
          done
      - name: Publish the product release with notes and version.json
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$(node -p "require('./version.json').version")}"
          tag="finapp-v$version"
          # The release's manifest is the root version.json exactly as committed at the tag:
          # https://github.com/<repo>/releases/download/finapp-v<version>/version.json
          mkdir -p dist
          git show "$tag:version.json" > dist/version.json

          # Notes: product + component changelog sections, the version table, then GitHub's list
          # of merged pull requests since the previous product release.
          node scripts/release-notes.mjs dist/version.json > notes.md
          previous=$(git tag --list 'finapp-v*' | sort -V | awk -v t="$tag" '$0 == t { print prev; exit } { prev = $0 }')
          args=(-f tag_name="$tag")
          [ -n "$previous" ] && args+=(-f previous_tag_name="$previous")
          if prs=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${args[@]}" --jq .body); then
            { echo; echo '## Pull requests'; echo; echo "$prs" | sed '1{/^## /d}'; } >> notes.md
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "FinApp $version" --notes-file notes.md
            gh release upload "$tag" dist/version.json --clobber
          else
            gh release create "$tag" --title "FinApp $version" --notes-file notes.md dist/version.json
          fi
