name: Android APKs

# Builds the Android APKs with EAS and attaches them to the product's GitHub release:
#   finapp-v1_8_0.apk               universal (every architecture)
#   finapp-v1_8_0-arm64-v8a.apk     most phones from 2017 on
#   finapp-v1_8_0-armeabi-v7a.apk   older 32-bit phones
#   finapp-v1_8_0-x86_64.apk        emulators and x86 devices (64-bit)
#   finapp-v1_8_0-x86.apk           emulators and x86 devices (32-bit)
#   SHA256SUMS.txt
#
# Manual on purpose: an Android release ships only when someone runs this workflow.
# Requires the repository secret EXPO_TOKEN (an Expo access token for the project's account).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Product version whose release gets the APKs (blank = version.json)
        required: false

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: production
            suffix: ''
          - profile: production-arm64-v8a
            suffix: -arm64-v8a
          - profile: production-armeabi-v7a
            suffix: -armeabi-v7a
          - profile: production-x86_64
            suffix: -x86_64
          - profile: production-x86
            suffix: -x86
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the release tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$(node -p "require('./version.json').version")}"
          git checkout "finapp-v$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "FILE_VERSION=${version//./_}" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build ${{ matrix.profile }} on EAS
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN repository secret to build APKs."
            exit 1
          fi
          bunx eas-cli@latest build --platform android --profile "${{ matrix.profile }}" \
            --non-interactive --wait --json > build.json
          url=$(node -p "require('./build.json')[0].artifacts.buildUrl")
          curl -fsSL "$url" -o "$GITHUB_WORKSPACE/finapp-v${FILE_VERSION}${{ matrix.suffix }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk${{ matrix.suffix || '-universal' }}
          path: finapp-v*.apk
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true
      - name: Attach APKs and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$(node -p "require('./version.json').version")}"
          tag="finapp-v$version"
          cd apks
          sha256sum finapp-v*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release view "$tag" >/dev/null
          gh release upload "$tag" finapp-v*.apk SHA256SUMS.txt --clobber
